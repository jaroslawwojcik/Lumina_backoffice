name: Backoffice CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backoffice-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_ENVIRONMENT: TEST
      VITE_API_BASE_URL: https://api.example.invalid
      VITE_FIREBASE_API_KEY: ci-placeholder
      VITE_FIREBASE_APP_ID: ci-placeholder
      VITE_FIREBASE_AUTH_DOMAIN: ci.example.invalid
      VITE_FIREBASE_PROJECT_ID: ci-placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build (validation only; never deploy this output)
        run: npm run build
